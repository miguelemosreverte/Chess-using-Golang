<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="book.css">
</head>
<body>
    <div class="container">
        <!-- Undo request panel (shown when there's a pending request) -->
        <div id="undo-panel" class="undo-panel" style="display: none;">
            <p id="undo-message"></p>
            <button class="accept-btn" onclick="acceptUndo()">Accept</button>
            <button class="reject-btn" onclick="rejectUndo()">Reject</button>
        </div>

        <!-- Promotion modal (shown above board) -->
        <div class="board-container">
            <div id="promotion-modal" class="promotion-modal" style="display: none;">
                <div class="promotion-option" data-piece="queen"></div>
                <div class="promotion-option" data-piece="rook"></div>
                <div class="promotion-option" data-piece="bishop"></div>
                <div class="promotion-option" data-piece="knight"></div>
            </div>
            <div class="board" id="board"></div>
        </div>


    </div>

    <!-- Check banner (shown briefly when in check) -->
    <div id="check-banner" class="check-banner" style="display: none;">CHECK!</div>

    <!-- Chapter selection menu -->
    <div id="chapter-menu" class="chapter-menu" style="display: none;">
        <div class="chapter-menu-content">
            <h2>Select Chapter</h2>
            <div id="chapter-list" class="chapter-list">
                <!-- Chapters will be populated by JavaScript -->
            </div>
            <button class="chapter-menu-close" onclick="closeChapterMenu()">Cancel</button>
        </div>
    </div>

    <!-- Chapter menu button removed - use book selector instead -->

    <!-- Dev mode legend (content set dynamically by JS) -->
    <div class="dev-legend"></div>

    <!-- Chat panel -->
    <div class="chat-panel">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendChat()">
            <button class="chat-send-btn" onclick="sendChat()">Send</button>
        </div>
    </div>

    <script>
        // Detect base path (works on GitHub Pages and locally)
        // On GH Pages: /Chess-using-Golang/  Locally: /
        var BASE_PATH = (function() {
            var scripts = document.getElementsByTagName('script');
            // Find the script tag in index.html to determine the base
            var path = window.location.pathname;
            // If path contains a known repo segment, use it as base
            var match = path.match(/^(\/[^/]+\/)/);
            // Check if the first segment is NOT a game ID (game IDs are alphanumeric, 8 chars)
            if (match && match[1].length > 10) {
                return match[1];
            }
            return '/';
        })();

        // GitHub Pages SPA: restore path after 404.html redirect
        (function() {
            var redirect = sessionStorage.getItem('redirect');
            if (redirect) {
                sessionStorage.removeItem('redirect');
                if (redirect !== BASE_PATH && redirect !== window.location.pathname) {
                    history.replaceState(null, '', redirect);
                }
            }
        })();
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="chapter-parser.js"></script>
    <script src="film-burn-transition.js"></script>
    <script src="book.js"></script>
    <script src="firebase-chess-engine.js"></script>
    <script src="board-and-background-image-sync.js"></script>
    <script src="app.js"></script>
</body>
</html>
