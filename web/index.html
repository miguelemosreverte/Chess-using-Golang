<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Undo request panel (shown when there's a pending request) -->
        <div id="undo-panel" class="undo-panel" style="display: none;">
            <p id="undo-message"></p>
            <button class="accept-btn" onclick="acceptUndo()">Accept</button>
            <button class="reject-btn" onclick="rejectUndo()">Reject</button>
        </div>

        <!-- Promotion modal (shown above board) -->
        <div class="board-container">
            <div id="promotion-modal" class="promotion-modal" style="display: none;">
                <div class="promotion-option" data-piece="queen"></div>
                <div class="promotion-option" data-piece="rook"></div>
                <div class="promotion-option" data-piece="bishop"></div>
                <div class="promotion-option" data-piece="knight"></div>
            </div>
            <div class="board" id="board"></div>
        </div>

        <div class="controls">
            <button id="new-game">New Game</button>
        </div>

        <div class="game-info">
            <div class="turn">Turn: <span id="turn">White</span></div>
            <div class="status">Status: <span id="status">ongoing</span></div>
        </div>
    </div>

    <!-- Check banner (shown briefly when in check) -->
    <div id="check-banner" class="check-banner" style="display: none;">CHECK!</div>

    <!-- Game over modal -->
    <div id="game-over-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h2 id="game-over-title">Game Over</h2>
            <p id="game-over-message" class="winner"></p>
            <button onclick="newGame()">Play Again</button>
            <button onclick="closeGameOverModal()">Review Game</button>
        </div>
    </div>

    <!-- Dev controls legend -->
    <div class="dev-legend">
        <div><b>Dev Mode</b> (Tab to exit)</div>
        <div>← → Background</div>
        <div>Drag corners to adjust</div>
        <div>B Border toggle</div>
        <div>0 Reset corners</div>
        <div>Enter Save config</div>
    </div>

    <!-- Chat panel -->
    <div class="chat-panel">
        <div class="chat-messages" id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="Type a message..." onkeypress="if(event.key==='Enter')sendChat()">
            <button class="chat-send-btn" onclick="sendChat()">Send</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
